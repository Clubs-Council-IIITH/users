[project]
name = "users-subgraph"
version = "1.0.0"
readme = "README.md"

requires-python = ">=3.14"
dependencies = [
    "cachetools>=7.1.4",
    "fastapi~=0.138.2",
    "phonenumbers~=9.0.33",
    "pydantic>=2.13.4,<3.0.0",
    "pymongo==4.17.0",
    "python-ldap==3.4.7",
    "strawberry-graphql[cli]==0.320.0",
    "typing-extensions>=4.15.0",
]

[tool.ruff]
line-length = 79
indent-width = 4

[tool.ruff.lint]
# line too long, unsorted imports, unused imports
extend-select = ["E501", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
